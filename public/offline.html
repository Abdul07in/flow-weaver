<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Offline — Flow Weaver</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#0b0b1f; color:#e7e7f5;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { max-width:420px; text-align:center; }
  h1 { font-size:1.5rem; margin:0 0 8px; }
  p { opacity:.75; margin:0 0 20px; line-height:1.5; }
  button { background:linear-gradient(135deg,#6366f1,#a855f7); color:#fff; border:0;
    padding:10px 18px; border-radius:10px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
  <div class="wrap"><div class="card">
    <h1>You're offline</h1>
    <p>Flow Weaver works offline for saved flows. Reconnect to sync new requests.</p>
    <button onclick="location.reload()">Try again</button>
  </div></div>
</body>
</html>
